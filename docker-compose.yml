services:
  mysql:
    image: mysql:5.7
    container_name: leaveapproval-mysql
    restart: unless-stopped
    ports:
      - "10010:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: local
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:5
    container_name: leaveapproval-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data

  # 应用镜像需自行构建（dotnet publish 产物），本地开发建议直接 dotnet run，默认注释。
  # leaveapproval-api:
  #   image: leaveapproval-api
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     ASPNETCORE_ENVIRONMENT: Production
  #     ASPNETCORE_URLS: http://+:5000
